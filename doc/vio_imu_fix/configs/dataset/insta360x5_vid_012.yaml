# SaDVIO copy of GUTWrap's VID_012 calibration (SaD_VIO_data/insta360x5/VID_012/insta360x5_vid_012.yaml, 2026-10-16;
# doc/nofovvio/NOFOVVIO_LEDGER.md). Changed: cu, cv - 0.5 px (COLMAP pixel centres at +0.5, the KB4 model and OpenCV
# at integer pixels). dt_imu_cam: SaDVIO places an IMU sample stamped t_imu at camera time t_imu - dt_imu_cam, the
# same convention as GUTWrap's t_imu = t_video + dt.
# Also changed: camera_1 T_BS translation = GUTWrap's rig translation (rear centre in the front camera, SfM units)
# in the body frame, [0.016507, 0.00019, 0.008646] units, times 1.37 m per unit = [0.022615, 0.00026, 0.011845] m
# (2.55 cm between the lenses; 2.4-2.7 cm over the scale's range). Scale: GUTWrap's two 1 x 1 x 0.5 m boxes in the
# arena, 1.37 m per SfM unit (1.31-1.45), VID_012/cube_corners_VID_012.csv, 2026-10-16.
# Insta360 X5 dual back-to-back fisheye + IMU, VID_012.
# Written by Digital_Twin_EXECO tools/export_sadvio_calib.py from /media/GS_Captures/Insta360x5/Insta360x5/VID_012/dual_fisheye/colmap/sparse_aligned.
# Intrinsics: COLMAP 4.2 / pycolmap bundle adjustment (OpenCV fisheye = KB4), scaled to 1920 px.
# camera T_BS: camera -> body, body = IMU frame (inverse of R_refcam_imu, which maps IMU -> front).
# R_refcam_imu estimated by rotation-only hand-eye (SfM vs integrated gyro), median residual 0.038 deg over 168 increments.
# dt_imu_cam = -0.005: our convention t_imu = t_video + dt (estimated, 5 ms search step).
dataset: insta360x5_vid_012
ncam: 2

camera_0:
  topic: /cam0/image_raw   # front lens (INSV video stream 0)
  T_BS:   # camera -> body (IMU); rotation estimated, translation unknown (0)
    cols: 4
    rows: 4
    data: [ 0.002092454582,  0.006665504888, -0.999975596041,  0.000000000000,
            0.027912217928, -0.999588559571, -0.006604518558,  0.000000000000,
           -0.999608188104, -0.027897717104, -0.002277642687,  0.000000000000,
            0.000000000000,  0.000000000000,  0.000000000000,  1.000000000000]
  rate_hz: 29.97
  resolution: [1920, 1920]
  projection_model: kb4
  intrinsics: [517.281413, 517.674509, 968.248779, 957.660628] # fu, fv, cu, cv at 1920 px, OpenCV pixel centres (GUTWrap's COLMAP centres - 0.5)
  distortion_model: kb4
  distortion_coefficients: [0.034110877, -0.001103357, 0.004173748, -0.001841469] # k1..k4

camera_1:
  topic: /cam1/image_raw   # rear lens (INSV video stream 1)
  T_BS:   # camera -> body (IMU); rotation estimated, translation unknown (0)
  # rear rotation = R_imu_front * R_front_rear; rig: COLMAP rig (/media/GS_Captures/Insta360x5/Insta360x5/VID_012/dual_fisheye/colmap/sparse_txt/rigs.txt); differs from the per-frame mean by 0.000 deg
  # rig translation (rear centre in front-camera frame, SfM units, scale unknown): [-0.008603, -0.000321, -0.016528] -- left 0 here
    cols: 4
    rows: 4
    data: [ 0.001296440219,  0.005162400373,  0.999985834332,  0.022615000000,
            0.009798808738, -0.999938731361,  0.005149453456,  0.000260000000,
            0.999951150102,  0.009791993973, -0.001346946162,  0.011845000000,
            0.000000000000,  0.000000000000,  0.000000000000,  1.000000000000]
  rate_hz: 29.97
  resolution: [1920, 1920]
  projection_model: kb4
  intrinsics: [515.724664, 516.325418, 963.590467, 956.100256] # fu, fv, cu, cv at 1920 px, OpenCV pixel centres (GUTWrap's COLMAP centres - 0.5)
  distortion_model: kb4
  distortion_coefficients: [0.036226240, -0.003991134, 0.005661689, -0.002107672] # k1..k4

imu:
  topic: /imu0
  T_BS:
    cols: 4
    rows: 4
    data: [ 1.000000000000,  0.000000000000,  0.000000000000,  0.000000000000,
            0.000000000000,  1.000000000000,  0.000000000000,  0.000000000000,
            0.000000000000,  0.000000000000,  1.000000000000,  0.000000000000,
            0.000000000000,  0.000000000000,  0.000000000000,  1.000000000000]
  rate_hz: 994.2
  gyroscope_noise_density: 0.00016   # PLACEHOLDER: TUM-VI value, X5 IMU noise unknown
  gyroscope_random_walk: 2.2e-05   # PLACEHOLDER: TUM-VI value, X5 IMU noise unknown
  accelerometer_noise_density: 0.0028   # PLACEHOLDER: TUM-VI value, X5 IMU noise unknown
  accelerometer_random_walk: 0.00086   # PLACEHOLDER: TUM-VI value, X5 IMU noise unknown
  dt_imu_cam: -0.005

stereo_sync_tolerance_ms: 1   # both lenses share one video clock
